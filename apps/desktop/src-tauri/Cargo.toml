[package]
name = "local-first-ai-video-studio"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Lets the static webview (origin tauri://localhost) call the RAG sidecar on
# http://127.0.0.1 — the HTTP runs in Rust, so webview CSP/CORS do not apply.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["std"] }
base64 = "0.22"
time = { version = "0.3", features = ["parsing", "macros"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
