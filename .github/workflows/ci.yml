name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Repo root IS the project (package.json sits at root on GitHub), so no
      # working-directory prefix — the previous value pointed at a folder that
      # does not exist in the repository and made every CI run fail.
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: npm audit --audit-level=high
        continue-on-error: true
