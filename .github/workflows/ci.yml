name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: local-first-ai-video-studio
      - run: npm audit --audit-level=high
        working-directory: local-first-ai-video-studio
        continue-on-error: true
