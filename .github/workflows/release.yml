# Release pipeline with code signing.
#
# Secrets to configure (org/repo → Settings → Secrets):
#   APPLE_IDENTITY            — base64 PKCS12 (.p12) of the Apple Developer ID app cert
#   APPLE_IDENTITY_PASSWORD   — p12 export password
#   APPLE_TEAM_ID             — Apple Team ID (for notarization)
#   APPLE_ID                  — Apple ID used for notarization
#   APPLE_PASSWORD            — App-specific password for notarization
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD (Windows, optional)
#
# NOTE (GitHub schema): the `env` context is NOT allowed inside a step's `env:` map —
# using it makes GitHub reject the whole workflow ("workflow file issue", 0 jobs).
# Values produced by one step are handed to the next step via a file / $GITHUB_ENV.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-test:
    # Self-hosted runner (Vostro) — không tốn quota GitHub Actions.
    runs-on: [self-hosted, self-vostro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install system deps (ffmpeg for media tests, webkit for cargo test)
        run: |
          sudo -n apt-get update && sudo -n apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev || echo "deps already present on this runner — skipping apt"
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - run: LIGHTWEIGHT=1 bash scripts/fetch-bundled-assets.sh
      - name: Build web frontend (generate_context needs frontendDist)
        run: |
          cd apps/web
          npm ci
          npm run build
      - run: cargo test
        working-directory: apps/desktop/src-tauri

  macos:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore signing certificate (skipped when secrets are absent)
        env:
          APPLE_IDENTITY_P12: ${{ secrets.APPLE_IDENTITY }}
          APPLE_IDENTITY_PASSWORD: ${{ secrets.APPLE_IDENTITY_PASSWORD }}
        run: |
          if [ -z "$APPLE_IDENTITY_P12" ]; then
            echo "No APPLE_IDENTITY secret; building unsigned."
            exit 0
          fi
          echo "$APPLE_IDENTITY_P12" | base64 -d > signing.p12
          security create-keychain -p build build.keychain
          security import signing.p12 -k build.keychain -P "$APPLE_IDENTITY_PASSWORD" -T /usr/bin/codesign
          security set-keychain-settings -u build.keychain
          security find-identity -v codesigning | grep 'Developer ID Application' | awk -F\" 'NR==1{print $2}' > "$RUNNER_TEMP/apple_signing_identity"
      - name: Fetch bundled core resources
        run: bash scripts/fetch-bundled-assets.sh
      - name: Build web frontend
        run: |
          cd apps/web
          npm ci
          npm run build
      - name: Build + sign + notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_IDENTITY }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IDENTITY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          # If no signing cert is available, use --no-sign to skip codesign
          cd apps/desktop
          npm install
          if [ -f "$RUNNER_TEMP/apple_signing_identity" ]; then
            APPLE_SIGNING_IDENTITY="$(cat "$RUNNER_TEMP/apple_signing_identity")"
            export APPLE_SIGNING_IDENTITY
            echo "Signing identity: $APPLE_SIGNING_IDENTITY"
            npx tauri build -b app
          else
            echo "No signing identity available; building unsigned."
            npx tauri build -b app --no-sign
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apps/desktop/src-tauri/target/release/bundle/macos/*.app

  windows:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch bundled core resources
        run: bash scripts/fetch-bundled-assets.sh
      - name: Verify bundled helper names (Windows)
        shell: bash
        run: |
          # Guards the customer build: bundled_bin probes node/bin/node.exe,
          # ffmpeg.exe and ffprobe.exe on Windows — a layout drift here shipped
          # a portable whose analysis/RAG helpers silently fell back to PATH.
          RES=apps/desktop/src-tauri/resources
          for f in node/bin/node.exe ffmpeg.exe ffprobe.exe; do
            if [[ ! -f "$RES/$f" ]]; then echo "missing bundled helper: $RES/$f" >&2; exit 1; fi
          done
          echo "all bundled helpers present"
      - name: Build web frontend
        run: |
          cd apps/web
          npm ci
          npm run build
      - name: Build + sign
        env:
          # Tauri 2 signs when these are set; otherwise it builds unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd apps/desktop
          npm install
          npx tauri build -b msi
      - name: Assemble Windows portable zip (exe + resources, no installer)
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target/release
          mkdir -p portable
          for exe in *.exe; do cp "$exe" portable/; done
          cp *.dll portable/ 2>/dev/null || true
          RES=../../resources
          cp -r "$RES/node" portable/node
          # ffmpeg/ffprobe ship with .exe names on Windows
          for bin in ffmpeg ffprobe; do
            for cand in "$RES/$bin" "$RES/$bin.exe"; do
              [[ -f "$cand" ]] && cp "$cand" portable/
            done
          done
          mkdir -p portable/models
          cp "$RES"/models/*.pt portable/models/ 2>/dev/null || true
          # RAG sidecar (build-node is gitignored; beforeBuildCommand built it
          # during the MSI build above) — without it YouTube Studio RAG is dead.
          ROOT=../../../../..
          cp -r "$ROOT/scripts" "$ROOT/adapters" "$ROOT/packages" "$ROOT/services" portable/
          cp -r "$ROOT/apps/web/build-node" portable/build-node
          printf "Local-first AI Video Studio - Portable\r\n\r\nDouble-click local-first-ai-video-studio.exe to run. No install needed.\r\nAll engine helpers (node, ffmpeg, whisper models) are bundled — no Node.js required.\r\nFirst run: open Settings -> Setup Whisper (one time).\r\n" > portable/README.txt
          # windows-latest's Git Bash ships GNU tar: its `-a` only infers
          # *compression* from the suffix, so `tar -a -cf x.zip` wrote an
          # uncompressed TAR named .zip — unopenable by Windows Explorer.
          # 7-Zip is preinstalled on the runner; -tzip makes a real zip.
          cd portable
          7z a -tzip -mx=3 ../portable-windows.zip . > /dev/null
          cd ..
          7z t portable-windows.zip > /dev/null   # fail the job on a corrupt archive
          ls -lh portable-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: apps/desktop/src-tauri/target/release/portable-windows.zip

  linux:
    runs-on: [self-hosted, self-vostro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install system deps
        run: |
          sudo -n apt-get update && sudo -n apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev || echo "deps already present on this runner — skipping apt"
      - name: Fetch bundled core resources
        run: bash scripts/fetch-bundled-assets.sh
      - name: Verify bundled helper names (Linux)
        shell: bash
        run: |
          RES=apps/desktop/src-tauri/resources
          for f in node/bin/node ffmpeg ffprobe; do
            if [[ ! -f "$RES/$f" ]]; then echo "missing bundled helper: $RES/$f" >&2; exit 1; fi
          done
          echo "all bundled helpers present"
      - name: Build web frontend
        run: |
          cd apps/web
          npm ci
          npm run build
      - name: Clean cargo cache (disk space)
        if: runner.os == 'Linux'
        run: cd apps/desktop && cargo clean 2>/dev/null || true
      - name: Build bundles
        env:
          # linuxdeploy AppImage không chạy được không có FUSE — extract-and-run
          # là workaround chuẩn cho self-hosted Linux runners.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cd apps/desktop
          npm install
          npx tauri build -b appimage
      - name: Stage linux installer for publish (same machine — skip GitHub round-trip)
        run: |
          mkdir -p ~/lfavis-dist/linux
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage ~/lfavis-dist/linux/
          ls -lh ~/lfavis-dist/linux/

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs: [macos, windows, linux]
    # Chạy trên self-hosted runner — nơi có rclone đã đăng nhập Drive của bạn.
    runs-on: [self-hosted, self-vostro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false
      - name: Pick up linux AppImage from the shared staging dir
        run: |
          mkdir -p dist/linux-installer
          cp ~/lfavis-dist/linux/*.AppImage dist/linux-installer/
          ls -lh dist/linux-installer/
      - name: Show collected artifacts
        run: find dist -type f | head -40
      - name: Zip macOS .app bundle (App Store bundles are directories)
        run: |
          cd dist/macos-app
          # The uploaded artifact holds the .app directory as zip archives
          # (upload-artifact archives directories); unpack those, then zip each
          # bundle itself so users get one clean download per platform.
          for z in *.zip; do
            [ -f "$z" ] || continue
            unzip -q -o "$z"
            rm -f "$z"
          done
          rm -rf macos-app/ 2>/dev/null || true   # drop any stale nested dir
          for app in *.app; do
            [ -d "$app" ] && zip -qry "${app%.app}.zip" "$app"
          done
          ls -lh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Local-first AI Video Studio v0.1.0
          body: |
            Desktop builds (local-first, offline).

            - **Windows:** `windows-installer/*.msi` — signed
            - **macOS:** `macos-app/*.zip` — unzip → drag `.app` to Applications (unsigned: right-click → Open)
            - **Linux:** `linux-installer/*.AppImage` — `chmod +x` then run
          files: |
            dist/**/*.msi
            dist/**/*.AppImage
            dist/macos-app/*.zip
          draft: false
      - name: Upload installers to Google Drive (customer-facing links)
        run: |
          RCLONE=/home/khanh/.local/bin/rclone
          DEST="gdrive:LFaIVS-Releases"
          # rclone copy matches by destination FILENAME. The portable's staging
          # name (portable-windows.zip) never matched the canonical customer
          # file ("Local-first AI Video Studio Portable.zip"), so every publish
          # created a stray instead of updating the link customers already have
          # (manual API PATCH was required after each run). copyto pins the
          # exact destination name → updates the existing file in place, Drive
          # file id preserved. Staged sources are globbed so a rename on the
          # builder side still uploads; only the Drive-side names are fixed.
          mac_zip=$(ls dist/macos-app/*.zip | head -1)
          msi=$(ls dist/windows-installer/*.msi | head -1)
          appimage=$(ls dist/linux-installer/*.AppImage | head -1)
          portable=$(ls dist/windows-portable/*.zip | head -1)
          "$RCLONE" copyto "$mac_zip"   "$DEST/Local-first AI Video Studio.zip"
          "$RCLONE" copyto "$msi"       "$DEST/Local-first AI Video Studio_0.1.0_x64_en-US.msi"
          "$RCLONE" copyto "$appimage"  "$DEST/Local-first AI Video Studio_0.1.0_amd64.AppImage"
          "$RCLONE" copyto "$portable"  "$DEST/Local-first AI Video Studio Portable.zip"
          # Self-heal: remove the stray that pre-fix publishes left behind.
          "$RCLONE" deletefile "$DEST/portable-windows.zip" 2>/dev/null || true
          echo "=== Customer download links (Google Drive):"
          for f in "Local-first AI Video Studio Portable.zip" "Local-first AI Video Studio.zip" "Local-first AI Video Studio_0.1.0_amd64.AppImage" "Local-first AI Video Studio_0.1.0_x64_en-US.msi"; do
            echo "$("$RCLONE" link "$DEST/$f")"
          done | tee drive-links.txt
          cat drive-links.txt >> "$GITHUB_STEP_SUMMARY"

